<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Second Opinion Settings</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 18px;
      background: #0e0e13;
      color: #fffaea;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 5.6px;
      color: #e96b34;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 500;
      color: #fffaea;
      letter-spacing: -0.2px;
    }
    .subtitle {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      color: #71717a;
      letter-spacing: 0.05em;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #71717a;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 5.6px;
      padding: 9px 12px;
      color: #fffaea;
      font-family: 'Geist Mono', monospace;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #e96b34;
    }
    .status-msg {
      font-family: 'Geist Mono', monospace;
      font-size: 11.5px;
      color: #62f6b5;
      margin-top: 6px;
      min-height: 16px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .btn-primary {
      flex: 1;
      background: #e96b34;
      color: #fffaea;
      border: none;
      border-radius: 9999px;
      padding: 9px 14px;
      font-family: 'Geist Mono', monospace;
      font-weight: 500;
      font-size: 11.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      flex: 1;
      background: #62f6b5;
      color: #0e0e13;
      border: none;
      border-radius: 9999px;
      padding: 9px 14px;
      font-family: 'Geist Mono', monospace;
      font-weight: 500;
      font-size: 11.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-secondary:hover {
      opacity: 0.9;
    }
    .footer-note {
      font-size: 11.5px;
      color: #71717a;
      margin-top: 16px;
      line-height: 1.5;
      border-top: 1px solid #27272a;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">◈</div>
    <div>
      <div class="title">SECOND OPINION</div>
      <div class="subtitle">CHATGPT AI AUDITOR</div>
    </div>
  </div>

  <div class="form-group">
    <label for="targetUrl">Web App Destination URL:</label>
    <input type="text" id="targetUrl" placeholder="http://localhost:5173" />
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="btn-row">
    <button id="saveBtn" class="btn-primary">Save URL →</button>
    <button id="openAppBtn" class="btn-secondary">Open App</button>
  </div>

  <div class="footer-note">
    Active on <strong>chatgpt.com</strong>. Look for the <code style="color:#e96b34">◈ AUDIT</code> button next to the copy icon or at the bottom-right corner!
  </div>

  <script src="popup.js"></script>
</body>
</html>
