<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Second Opinion Settings</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #06051d;
      color: #cad5e2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(229, 231, 235, 0.1);
      padding-bottom: 10px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #0f1c36;
      border: 1px solid #00bc7d;
      border-radius: 6px;
      color: #00bc7d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: #0f1c36;
      border: 1px solid rgba(229, 231, 235, 0.2);
      border-radius: 6px;
      padding: 8px 10px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #00bc7d;
    }
    .status-msg {
      font-size: 12px;
      color: #00bc7d;
      margin-top: 6px;
      min-height: 16px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      background: #00bc7d;
      color: #06051d;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #00d68f;
    }
    .btn-secondary {
      background: #1d293d;
      color: #cad5e2;
      border: 1px solid rgba(229, 231, 235, 0.15);
    }
    .btn-secondary:hover {
      background: #314062;
      color: #ffffff;
    }
    .footer-note {
      font-size: 11px;
      color: #64748b;
      margin-top: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">◈</div>
    <div class="title">Second Opinion</div>
  </div>

  <div class="form-group">
    <label for="targetUrl">Second Opinion Web App URL:</label>
    <input type="text" id="targetUrl" placeholder="http://localhost:5173" />
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="btn-row">
    <button id="saveBtn">Save URL</button>
    <button id="openAppBtn" class="btn-secondary">Open App</button>
  </div>

  <div class="footer-note">
    Active on <strong>chatgpt.com</strong> and <strong>chat.openai.com</strong>. Click "Audit" below any response to verify.
  </div>

  <script src="popup.js"></script>
</body>
</html>
